{% set name = "rangehttpserver" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/rangehttpserver-{{ version }}.tar.gz
  sha256: d5ddccee219b359598e41da0c5fbf30a2579297094f5a682755e2586388a5306

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - RangeHTTPServer
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/danvk/RangeHTTPServer/
  summary: SimpleHTTPServer with support for Range requests
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - raybellwaves
